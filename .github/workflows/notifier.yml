name: Free Game Notifier

on:
  schedule:
    # The cron expression is generated from config.py before each run.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: free-game-notifier
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade pip and install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade -r requirements.txt

      - name: Apply configured schedule
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_ID: notifier.yml
        run: |
          python - <<'PY'
          import ast
          import os
          import re
          import urllib.request
          from pathlib import Path

          tree = ast.parse(Path("config.py").read_text(encoding="utf-8"))
          interval = None
          for node in tree.body:
              if isinstance(node, ast.Assign) and any(
                  isinstance(target, ast.Name) and target.id == "RUN_INTERVAL_HOURS"
                  for target in node.targets
              ):
                  interval = ast.literal_eval(node.value)
                  break

          if not isinstance(interval, int) or not 1 <= interval <= 24:
              raise SystemExit("RUN_INTERVAL_HOURS in config.py must be an integer from 1 to 24")

          cron = f"17 */{interval} * * *"
          workflow = Path(".github/workflows/notifier.yml").read_text(encoding="utf-8")
          workflow = re.sub(
              r'(# The cron expression is generated from config.py before each run\.\n\s*- cron: )"[^"]+"',
              lambda match: match.group(1) + f'"{cron}"',
              workflow,
              count=1,
          )
          Path(".github/workflows/notifier.yml").write_text(workflow, encoding="utf-8")

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPOSITORY"]
          workflow_id = os.environ["WORKFLOW_ID"]
          payload = workflow.encode()
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/contents/.github/workflows/{workflow_id}",
              data=__import__("json").dumps({
                  "message": f"Apply configured {interval}-hour notifier schedule",
                  "content": __import__("base64").b64encode(payload).decode(),
                  "sha": __import__("json").loads(urllib.request.urlopen(
                      urllib.request.Request(
                          f"https://api.github.com/repos/{repo}/contents/.github/workflows/{workflow_id}",
                          headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"}
                      )
                  ).read())["sha"],
                  "branch": "main"
              }).encode(),
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28"
              },
              method="PUT",
          )
          with urllib.request.urlopen(request) as response:
              print(f"Configured scheduled workflow to run every {interval} hours.")
          PY

      - name: Run notifier
        env:
          FREEGAMERADAR_API_KEY: ${{ secrets.FREEGAMERADAR_API_KEY }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
        run: python notifier.py

      - name: Commit duplicate-tracking state
        if: always()
        run: |
          if [[ -f data/seen_games.json ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/seen_games.json
            if ! git diff --cached --quiet; then
              git commit -m "Update notified free games state [skip ci]"
              git push
            fi
          fi
