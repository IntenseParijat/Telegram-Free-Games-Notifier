name: Free Game Notifier

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: free-game-notifier-main
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade pip and install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade -r requirements.txt

      - name: Validate configuration and notifier
        run: |
          set -euo pipefail
          python -m py_compile notifier.py config.py test_notifier.py
          python -m unittest -v test_notifier

      - name: Run notifier
        id: notifier
        continue-on-error: true
        env:
          FREEGAMERADAR_API_KEY: ${{ secrets.FREEGAMERADAR_API_KEY }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
        run: python notifier.py

      - name: Commit duplicate-tracking state
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions[bot]@users.noreply.github.com"

          if [[ ! -f data/seen_games.json ]]; then
            echo "No duplicate-state file exists; notifier did not create one."
            exit 0
          fi

          git add data/seen_games.json
          if git diff --cached --quiet; then
            echo "Duplicate state did not change."
            exit 0
          fi

          git commit -m "Update notified free games state [skip ci]"

          # Serialize state updates in this workflow. Refresh from main before
          # pushing so a concurrent repository update cannot silently overwrite it.
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "State update conflicted with main; refusing to overwrite remote state."
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Duplicate-tracking state committed to main."
              exit 0
            fi
            echo "Push attempt $attempt failed; refreshing main before retry."
            sleep "$((attempt * 2))"
          done

          echo "Could not push duplicate-tracking state after 3 attempts."
          exit 1

      - name: Preserve notifier failure status
        if: always() && steps.notifier.outcome == 'failure'
        run: |
          echo "Notifier failed. Successfully posted items were saved; failed items remain pending."
          exit 1
