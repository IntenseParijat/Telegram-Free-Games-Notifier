name: Free Game Notifier

on:
  schedule:
    # The cron is kept aligned with config.py by the setup workflow.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: free-game-notifier
  cancel-in-progress: false

jobs:
  sync-schedule:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply configured schedule
        run: |
          python - <<'PY'
          import ast
          import re
          from pathlib import Path

          config = ast.parse(Path("config.py").read_text(encoding="utf-8"))
          hours = None
          for node in config.body:
              if isinstance(node, ast.Assign) and any(
                  isinstance(target, ast.Name) and target.id == "RUN_INTERVAL_HOURS"
                  for target in node.targets
              ):
                  hours = ast.literal_eval(node.value)
                  break
          if type(hours) is not int or not 1 <= hours <= 24:
              raise SystemExit("RUN_INTERVAL_HOURS must be an integer from 1 to 24")

          path = Path(".github/workflows/notifier.yml")
          source = path.read_text(encoding="utf-8")
          updated = re.sub(
              r'(?m)(^\s*- cron:\s*)["\'][^"\']+["\']',
              lambda match: match.group(1) + f'"17 */{hours} * * *"',
              source,
              count=1,
          )
          if updated == source:
              print("Workflow cron already matches config.py or no update was required.")
          else:
              path.write_text(updated, encoding="utf-8")
              print(f"Updated cron to every {hours} hours.")
          PY
      - name: Commit changed schedule
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/notifier.yml
          if ! git diff --cached --quiet; then
            git commit -m "Sync notifier schedule with config.py [skip ci]"
            git push
          fi

  notify:
    needs: sync-schedule
    if: always() && (needs.sync-schedule.result == 'success' || needs.sync-schedule.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Upgrade pip and install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade -r requirements.txt
      - name: Run notifier
        env:
          FREEGAMERADAR_API_KEY: ${{ secrets.FREEGAMERADAR_API_KEY }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
        run: python notifier.py
      - name: Commit duplicate-tracking state
        if: always()
        run: |
          if [[ -f data/seen_games.json ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+actions[bot]@users.noreply.github.com"
            git add data/seen_games.json
            if ! git diff --cached --quiet; then
              git commit -m "Update notified free games state [skip ci]"
              git push
            fi
          fi
